<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>髙根 未来 | ポータル</title>
<meta name="description" content="髙根 未来の資料・サイト・写真をまとめたポータルです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:ital,wght@0,500;0,700;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c43b2a'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-family='serif' font-weight='700' fill='white'%3E滾%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><span class="seal-mini">滾</span><span id="brandName">髙根 未来</span></a>
    <nav class="nav">
      <a href="#profile">プロフィール</a>
      <a href="#docs">資料</a>
      <a href="#links">リンク</a>
      <a href="#gallery">写真</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hero-photo empty" id="heroPhoto"><div class="seal">滾</div></div>
    <div class="hero-text">
      <p class="role" id="role"></p>
      <h1 class="name"><span id="name"></span><small id="reading"></small></h1>
      <p class="lead" id="lead"></p>
      <div class="hero-actions" id="actions"></div>
    </div>
    <div class="tate" id="tate"><span id="tagline"></span><div class="seal">滾</div></div>
  </div>
</section>

<main>
  <section class="section" id="profile">
    <div class="wrap">
      <div class="section-head"><h2>プロフィール</h2><span>Profile</span></div>
      <div class="profile">
        <div class="message" id="message"></div>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </div>
  </section>

  <section class="section" id="docs">
    <div class="wrap">
      <div class="section-head"><h2>資料</h2><span>Documents</span><span class="count" id="docCount"></span></div>
      <ul class="docs" id="docList"></ul>
    </div>
  </section>

  <section class="section" id="links">
    <div class="wrap">
      <div class="section-head"><h2>サイト</h2><span>Links</span></div>
      <ul class="links" id="linkList"></ul>
    </div>
  </section>

  <section class="section" id="gallery">
    <div class="wrap">
      <div class="section-head"><h2>写真</h2><span>Gallery</span></div>
      <div class="gallery" id="galleryList"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <div>
      <p class="fname" id="footName"></p>
      <div id="footContact"></div>
    </div>
    <div class="copy" id="copy"></div>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="close" id="lbClose" aria-label="閉じる">✕</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ICON = {
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>'
  };

  let data;
  try {
    const res = await fetch('data/site.json?v=' + Date.now(), { cache: 'no-store' });
    data = await res.json();
  } catch (e) {
    document.body.innerHTML = '<p style="padding:40px">読み込みに失敗しました。少し待って再読み込みしてください。</p>';
    return;
  }
  const p = data.profile || {};

  /* hero */
  document.title = (p.name || '') + ' | ポータル';
  $('brandName').textContent = p.name || '';
  $('role').textContent = p.title || '';
  $('name').textContent = p.name || '';
  $('reading').textContent = p.reading || '';
  $('lead').textContent = p.lead || '';
  $('tagline').innerHTML = [...(p.tagline || '')].map(c => '<i>' + esc(c) + '</i>').join('');
  if (!p.tagline) $('tate').remove();
  const ph = $('heroPhoto');
  if (p.photo) {
    ph.classList.remove('empty');
    ph.innerHTML = '<img src="' + esc(p.photo) + '" alt="' + esc(p.name) + '">';
  } else {
    ph.remove();
    document.querySelector('.hero .wrap').classList.add('no-photo');
  }
  const acts = [];
  if (p.email) acts.push('<a class="btn primary" href="mailto:' + esc(p.email) + '">' + ICON.mail + 'メール</a>');
  if (p.phone) acts.push('<a class="btn" href="tel:' + esc(p.phone.replace(/[^\d+]/g, '')) + '">' + ICON.phone + '電話</a>');
  if (p.website) acts.push('<a class="btn" href="' + esc(p.website) + '" target="_blank" rel="noopener">' + ICON.site + '会社サイト</a>');
  $('actions').innerHTML = acts.join('');

  /* profile */
  const paras = String(p.message || '').split(/\n+/).filter(Boolean).map(t => '<p>' + esc(t) + '</p>');
  if (paras.length) paras.push('<p class="sign">' + esc(p.name) + '</p>');
  $('message').innerHTML = paras.join('');
  $('timeline').innerHTML = (p.timeline || []).map(t =>
    '<li><span class="year">' + esc(t.year) + '</span>' + esc(t.text) + '</li>').join('');
  if (!paras.length && !(p.timeline || []).length) $('profile').style.display = 'none';

  /* documents */
  const docs = data.documents || [];
  $('docCount').textContent = docs.length ? docs.length + '件' : '';
  $('docList').innerHTML = docs.length ? docs.map(d => {
    const thumb = d.thumb ? '<img src="' + esc(d.thumb) + '" alt="">' : ICON.pdf;
    const meta = [d.size, d.date].filter(Boolean).map(esc).join('　');
    return '<li class="doc">' +
      '<div class="doc-thumb">' + thumb + '</div>' +
      '<div><h3>' + esc(d.title) + '</h3>' + (d.description ? '<p>' + esc(d.description) + '</p>' : '') +
      (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>' +
      '<a class="btn" href="' + esc(d.file) + '" target="_blank" rel="noopener" download>' + ICON.dl + '開く / 保存</a>' +
      '</li>';
  }).join('') : '<li class="empty-note">資料は準備中です。</li>';

  /* links */
  const links = data.links || [];
  $('linkList').innerHTML = links.length ? links.map(l => {
    let host = '';
    try { host = new URL(l.url).hostname.replace(/^www\./, ''); } catch (e) {}
    const cover = l.image
      ? '<img src="' + esc(l.image) + '" alt="">'
      : '<span class="ini">' + esc(host || l.title) + '</span>';
    return '<li><a class="link-card" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
      '<div class="cover">' + cover + '</div>' +
      '<div class="body"><h3>' + esc(l.title) + '</h3>' + (l.description ? '<p>' + esc(l.description) + '</p>' : '') +
      (host ? '<div class="domain"><img src="https://www.google.com/s2/favicons?sz=32&domain=' + esc(host) + '" alt="">' + esc(host) + '</div>' : '') +
      '</div></a></li>';
  }).join('') : '<li class="empty-note">リンクは準備中です。</li>';

  /* gallery */
  const imgs = data.images || [];
  $('galleryList').innerHTML = imgs.length ? imgs.map((im, i) =>
    '<figure data-i="' + i + '"><img src="' + esc(im.file) + '" alt="' + esc(im.caption || '') + '" loading="lazy">' +
    (im.caption ? '<figcaption>' + esc(im.caption) + '</figcaption>' : '') + '</figure>').join('')
    : '<p class="empty-note">写真は準備中です。</p>';
  const lb = $('lightbox');
  $('galleryList').addEventListener('click', e => {
    const f = e.target.closest('figure'); if (!f) return;
    const im = imgs[+f.dataset.i];
    $('lbImg').src = im.file; $('lbCap').textContent = im.caption || '';
    lb.classList.add('open');
  });
  const closeLb = () => lb.classList.remove('open');
  $('lbClose').addEventListener('click', closeLb);
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

  /* footer */
  $('footName').textContent = p.name || '';
  $('footContact').innerHTML = [
    p.title ? esc(p.title) : '',
    p.email ? '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>' : '',
    p.phone ? '<a href="tel:' + esc(p.phone.replace(/[^\d+]/g, '')) + '">' + esc(p.phone) + '</a>' : ''
  ].filter(Boolean).join('<br>');
  $('copy').textContent = '© ' + new Date().getFullYear() + ' ' + (p.name || '');
})();
</script>
</body>
</html>
